version: '3.10'

services:
  janus:
    build: .
    container_name: janus-gateway
    ports:
      - "8088:8088"     # HTTP
      - "8188:8188"     # WebSockets
      - "7088:7088"     # Admin/monitor
      - "20000-20010:20000-20010/udp"  # RTP/ICE ports
    volumes:
      - ./janus-config:/opt/janus/etc/janus
      - ./janus-data:/opt/janus/var
      - ./recordings:/opt/recordings
      - ./plugins:/opt/janus/lib/janus/plugins  # Mount custom plugins (if needed)
    environment:
      - TZ=Asia/Dhaka
      - JANUS_DEBUG=1
      - JANUS_LOG_LEVEL=debug
    network_mode: "host"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always